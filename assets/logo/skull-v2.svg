<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 140" fill="none"
     stroke="#00ff41" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

  <!-- One silhouette: a big round dome that narrows into a single shallow
       jaw scallop. No hanging lobes, no separate jaw box. -->
  <path d="M75 15
           C43 15 20 38 20 67
           C20 84 29 97 43 104
           C46 105.5 48 108 48 111
           V113
           C48 117 51 119 55 119
           H95
           C99 119 102 117 102 113
           V111
           C102 108 104 105.5 107 104
           C121 97 130 84 130 67
           C130 38 107 15 75 15 Z"/>

  <!-- Sockets: large solid ovals, set low and wide. -->
  <ellipse cx="52" cy="69" rx="16" ry="18.5" fill="#00ff41" stroke="none"/>
  <ellipse cx="98" cy="69" rx="16" ry="18.5" fill="#00ff41" stroke="none"/>

  <!-- Nose: small rounded triangle. -->
  <path d="M75 88
           C72.5 92 70 94 70 96
           C70 98 72 99 75 99
           C78 99 80 98 80 96
           C80 94 77.5 92 75 88 Z"
        fill="#00ff41" stroke="none"/>

  <!-- Teeth: notches dropped from the mouth line, anchored to it. -->
  <g fill="#00ff41" stroke="none">
    <rect x="63" y="106" width="8" height="10" rx="2"/>
    <rect x="79" y="106" width="8" height="10" rx="2"/>
  </g>
</svg>
