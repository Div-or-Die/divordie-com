<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 140" fill="none"
     stroke="#00ff41" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

  <!-- Big rounded cranium. The oversized dome against a small lower face
       is what reads chibi — the cuteness is in the ratio, not the details. -->
  <path d="M75 12
           C46 12 24 31 24 58
           C24 72 30 83 40 90
           C44 92.5 46 95 46 98
           V102
           H104
           V98
           C104 95 106 92.5 110 90
           C120 83 126 72 126 58
           C126 31 104 12 75 12 Z"/>

  <!-- Sockets: big and round for the chibi read, but with a straight
       top edge and a slight inward tilt so they stay skull, not eyes. -->
  <path d="M36 51
           H61
           L59 66
           C57.5 73 52.5 77 47 77
           C40 77 35 71 35 62
           C35 57 35.3 53.5 36 51 Z"
        fill="#00ff41" stroke="none"/>
  <path d="M114 51
           H89
           L91 66
           C92.5 73 97.5 77 103 77
           C110 77 115 71 115 62
           C115 57 114.7 53.5 114 51 Z"
        fill="#00ff41" stroke="none"/>

  <!-- Small nasal cavity, kept low and tidy. -->
  <path d="M75 82 L69 93 H81 Z"
        fill="#00ff41" fill-opacity="0.9" stroke="none"/>

  <!-- Jaw: narrow against the big cranium, rounded chin. -->
  <path d="M47 102
           H103
           V110
           C103 119 95 124 84 124
           H66
           C55 124 47 119 47 110
           Z"/>

  <!-- Teeth as solid blocks with real gaps — reads as a mouth, not a grille. -->
  <g fill="#00ff41" stroke="none">
    <rect x="57.5" y="104" width="8.5" height="9" rx="1.6"/>
    <rect x="68.5" y="104" width="13" height="11" rx="1.8"/>
    <rect x="84" y="104" width="8.5" height="9" rx="1.6"/>
  </g>

  <!-- Cheek ticks. -->
  <path d="M27 74 h7" stroke-width="2.8" stroke-opacity="0.5"/>
  <path d="M123 74 h-7" stroke-width="2.8" stroke-opacity="0.5"/>

  <!-- Crown seam. -->
  <path d="M75 12 v8" stroke-width="2.6" stroke-opacity="0.4"/>
</svg>
