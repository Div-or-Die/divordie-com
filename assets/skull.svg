<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 140" fill="none"
     stroke="#00ff41" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

  <!-- Cranium + jaw as ONE silhouette: a big round dome with a small
       scalloped bump beneath it, never a separate jaw box. -->
  <path d="M75 14
           C43 14 20 37 20 66
           C20 83 28 96 41 103
           C46 111 52 116 59 116
           C66 116 70 111 71 105
           C71.5 102.5 73 101.5 75 101.5
           C77 101.5 78.5 102.5 79 105
           C80 111 84 116 91 116
           C98 116 104 111 109 103
           C122 96 130 83 130 66
           C130 37 107 14 75 14 Z"/>

  <!-- Sockets: big solid ovals, low and wide apart. -->
  <ellipse cx="51" cy="70" rx="16" ry="18.5" fill="#00ff41" stroke="none"/>
  <ellipse cx="99" cy="70" rx="16" ry="18.5" fill="#00ff41" stroke="none"/>

  <!-- Nose: small rounded triangle, tucked below and between the sockets. -->
  <path d="M75 84
           C72.5 88 70 90 70 92
           C70 94 72 95 75 95
           C78 95 80 94 80 92
           C80 90 77.5 88 75 84 Z"
        fill="#00ff41" stroke="none"/>

  <!-- Tooth notches in the jaw bump. -->
  <path d="M64 105 v6 M86 105 v6" stroke-width="3.2" stroke-opacity="0.8"/>
</svg>
